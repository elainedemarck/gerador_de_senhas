<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section class="conteudo">
        <div class="conteudo-titulo">
            <img src="unlock.svg.png" alt="">
            <h2 class="titulo-principal">Gerador de senhas</h2>
            <h3 class="titulo-secundario">Gere instantaneamente uma senha aleatoria e segura</h3>
        </div>
        <div class="conteudo-senha">
            <label for="senha">senha </label>
            <input name="senha" type="text" id="campo-senha" readonly>
        </div>
        <div class="parametro"> 
            <h3 class="parametre-titulo">personalize sua senha</h3>
            <div class="parametro-coluna__senha">
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Numero de caracteres</h4>
                    <div class="parametro-senha-botoes">
                       <button class="parametro-senha__botao">-</button>
                       <p class="parametro-senha__texto">12</p>
                       <button class="parametro-senha__botao">+</button>
                    </div>
                </div>
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Caracteristicas das senhas</h4>
                    <div class="parametro-senha-checkbox">
                        <input name="maiusculo" type="checkbox" class="checkbox" checked>
                        <label for="maiusculo">Letras maiusculas</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                       
                        <input name="minusculo" type="checkbox" class="checkbox">
                        <label for="minusculo">Letras minusculas</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name="numero" type="checkbox" class="checkbox" checked>
                        <label for="numero">Numero</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name="simbolo" type="checkbox" class="checkbox" checked>
                        <label for="simbolo">Simbolos</label>
                    </div>
                </div>
                <div class="parametro-senha">
                 <h4 class="parametro-senha_titulo">Força da senha</h4>
                 <div class="barra"></div>
                 <div class="forca fraca"></div>
                 <div class="parametro-senha-textos">
                    <p>Fraca</p>
                    <p>Média</p>
                    <p>Forte</p>
                 </div>
                 <p class="entropia"></p>
                </div>
            </div>
        </div>
    </section>
    <script src="main.js"></script>
</body>
</html>
